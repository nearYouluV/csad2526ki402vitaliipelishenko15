name: CI/CD Pipeline

# Trigger on push to branches containing 'develop' or 'master' in their name
on:
  push:
    branches:
      - '*develop*'
      - '*master*'
  pull_request:
    branches:
      - '*develop*'
      - '*master*'

jobs:
  cross_build:
    name: Cross Platform Build and Test
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            cmake_generator: "Unix Makefiles"
            shell: bash
          - os: macos-latest
            cmake_generator: "Unix Makefiles"
            shell: bash
          - os: windows-latest
            cmake_generator: "Visual Studio 16 2019"
            shell: pwsh
    
    defaults:
      run:
        shell: ${{ matrix.shell }}
    
    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Step 2: Install CMake (if needed)
      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v1.13
        with:
          cmake-version: '3.16'
      
      # Step 3: Install build tools for Windows
      - name: Install build tools (Windows)
        if: matrix.os == 'windows-latest'
        uses: microsoft/setup-msbuild@v1.1
      
      # Step 4: Make ci.sh executable (Unix systems)
      - name: Make ci.sh executable
        if: matrix.os != 'windows-latest'
        run: chmod +x ci.sh
      
      # Step 5: Run configuration and building (Unix systems)
      - name: Run CI script (Unix)
        if: matrix.os != 'windows-latest'
        run: ./ci.sh
      
      # Step 5: Run configuration and building (Windows)
      - name: Run CI script (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          # Create build directory
          mkdir -Force build
          cd build
          
          # Try Visual Studio generator first, fallback to NMake
          echo "Trying Visual Studio generator..."
          $vsResult = cmake .. -G "${{ matrix.cmake_generator }}" -A x64
          if ($LASTEXITCODE -ne 0) {
            echo "Visual Studio generator failed, trying NMake Makefiles..."
            Remove-Item -Recurse -Force CMakeFiles -ErrorAction SilentlyContinue
            Remove-Item CMakeCache.txt -ErrorAction SilentlyContinue
            cmake .. -G "NMake Makefiles"
          }
          
          if ($LASTEXITCODE -eq 0) {
            echo "CMake configuration successful!"
            # Build the project
            cmake --build .
            
            # Run tests
            ctest --output-on-failure
          } else {
            echo "CMake configuration failed!"
            exit 1
          }
          
          # List build output for debugging
          echo "Build directory contents:"
          Get-ChildItem -Recurse -Include *.exe
          echo "All files in build directory:"
          Get-ChildItem -Recurse
      
      # Step 6: Upload build artifacts
      - name: Upload artifacts (Unix)
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.os }}
          path: |
            build/bin/
          retention-days: 7
      
      # Step 6: Upload build artifacts (Windows)
      - name: Upload artifacts (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.os }}
          path: |
            build/Release/
            build/Debug/
            build/**/Release/
            build/**/Debug/
            build/*.exe
            build/**/*.exe
          if-no-files-found: warn
          retention-days: 7
      
      # Step 7: Deploy (placeholder - customize as needed)
      - name: Deploy
        run: |
          echo "🚀 Deployment step for ${{ matrix.os }}"
          echo "Build completed successfully on ${{ matrix.os }}"
          echo "Artifacts are ready for deployment"

  # Optional: Create a release if all builds succeed
  create_release:
    name: Create Release
    needs: cross_build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || contains(github.ref, 'master')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          body: |
            🎉 Automated release from CI/CD pipeline
            
            Built and tested on:
            - ✅ Ubuntu Latest
            - ✅ macOS Latest  
            - ✅ Windows Latest
            
            **Changes in this release:**
            ${{ github.event.head_commit.message }}
          files: |
            build-artifacts-*/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
